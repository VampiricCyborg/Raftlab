[project]
name = "raftlab"
version = "0.1.0"
description = "Raft consensus over a deterministic discrete-event network simulator, with continuous safety-invariant checking."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raftlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
